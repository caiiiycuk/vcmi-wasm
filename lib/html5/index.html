<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />

  <title>DOS VCMI</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      padding: 0;
      margin: 0;
      overflow: hidden;
      height: 100%;
      background: #070b12;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas {
      width: 100%;
      height: 100%;
    }

    #status {
      min-height: 1.25rem;
    }

    #spinner {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      text-align: center;
    }

    .spinner-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: min(100vw, 100%);
      max-width: 100vw;
      padding: 1.5em 1rem;
      box-sizing: border-box;
      line-height: 150%;
    }

    .spinner-logo {
      display: block;
      width: min(320px, 100%);
      max-width: 100%;
      max-height: 60vh;
      height: auto;
      object-fit: contain;
    }

    .hidden {
      display: none !important;
    }

    .opacity-0 {
      opacity: 0 !important;
    }

    .save-toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 2147483646;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      max-width: min(440px, calc(100vw - 32px));
      padding: 14px 16px;
      box-sizing: border-box;
      border: 1px solid rgba(120, 173, 255, 0.25);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(17, 24, 38, 0.96), rgba(11, 16, 26, 0.94));
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.38);
      color: #eff4ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.35;
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .save-toast__dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: #78adff;
      box-shadow: 0 0 0 6px rgba(120, 173, 255, 0.15);
    }

    .save-toast__text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .save-toast__title {
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .save-toast__subtitle {
      color: #9fb1cf;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <figure id="spinner">
    <div class="spinner-content">
      <img src="dosvcmi.png" class="spinner-logo"></img>
      <strong>DOS VCMI</strong>
      <div id="status"></div>
      <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
    </div>
  </figure>
  <canvas id="canvas"></canvas>
  <div id="save-toast" class="save-toast hidden opacity-0" role="status" aria-live="polite" aria-atomic="true">
    <span class="save-toast__dot"></span>
    <span class="save-toast__text">
      <span class="save-toast__title">Saving game</span>
      <span class="save-toast__subtitle">Cloud sync in progress</span>
    </span>
  </div>

  <script type="text/javascript">
    if (window.location.host === "test.js-dos.com") {
      window.VCMI_WASM_URL = 'vcmiclient.wasm';
      window.VCMI_DATA_URL = 'vcmiclient.data';
    } else {
      window.VCMI_WASM_URL = "https://br.cdn.dos.zone/vcmi/vcmiclient-v1/vcmiclient.wasm";
      window.VCMI_DATA_URL = "https://br.cdn.dos.zone/vcmi/vcmiclient-v1/vcmiclient.data";
    }
  </script>
  <script type="text/javascript">
    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    const v8Endpoint = "https://d5dn8hh4ivlobv6682ep.apigw.yandexcloud.net";
    const presignPut = v8Endpoint + "/presign-put";
    const v8key = localStorage.getItem("mp.v8key");
    const loadedMusic = {};
    const module = {
      websocket: {
        url: "wss://cloud.dos.zone:8443/vcmi-wss"
      },
      mainMenuQuit: () => {
        const url = new URL(location.href);
        url.pathname = url.pathname.substring(0, url.pathname.lastIndexOf('/')) + "/launcher.html";
        url.search = "?gameUrl=" + encodeURIComponent(location.href);
        location.href = url.toString();
      },
      locateFile: (path, prefix) => {
        if (path.endsWith('.wasm'))
          return window.VCMI_WASM_URL;
        if (path.endsWith('.data'))
          return window.VCMI_DATA_URL;
        return `${prefix || defaultBase}${path}`;
      },
      onRuntimeInitialized: async () => {
        try {
          await cloudSaves;
        } catch (error) {
          console.error("Unable to load cloud saves", error);
        }
        const FS = module.FS;
        const OPFS = module.OPFS;

        // cache directories
        FS.mkdir("/home/web_user/.cache");
        FS.mkdir("/home/web_user/.cache/vcmi");
        // user directory
        FS.mkdir("/home/web_user/.local");
        FS.mkdir("/home/web_user/.local/share");
        FS.mkdir("/home/web_user/.local/share/vcmi");
        FS.mount(OPFS, {
          autoPersist: false,
          root: "/home/web_user/.local/share/vcmi",
        }, "/home/web_user/.local/share/vcmi");

        // config directory
        FS.mkdir("/home/web_user/.config");
        FS.mkdir("/home/web_user/.config/vcmi");
        FS.mount(OPFS, {
          autoPersist: true,
          root: "/home/web_user/.config/vcmi",
        }, "/home/web_user/.config/vcmi");


        await new Promise(resolve => {
          OPFS.syncFsOnProgress = (progress, type, file) => {
            fsSyncProgress.update(progress, type, file);
          };
          fsSyncProgress.begin();
          FS.syncfs(true, (err) => {
            if (err) {
              console.error('fs sync failed', err);
            }
            OPFS.syncFsOnProgress = null;
            fsSyncProgress.finish();
            resolve();
          });
        });

        module.canvas = document.getElementById("canvas");

        let currentCanvasSize = { width: 0, height: 0 };
        const handleResize = () => {
          const dpi = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
          const cssWidth = module.canvas.clientWidth || window.innerWidth;
          const cssHeight = module.canvas.clientHeight || window.innerHeight;
          currentCanvasSize = {
            width: Math.max(1, Math.round(cssWidth * dpi)),
            height: Math.max(1, Math.round(cssHeight * dpi)),
          };
          module._vcmiOnCanvasResize();
        };

        const canvasResizeObserver = new ResizeObserver(handleResize);
        canvasResizeObserver.observe(module.canvas);
        handleResize();

        document.getElementById("spinner").style.display = "none";

        module.getWidth = () => currentCanvasSize.width;
        module.getHeight = () => currentCanvasSize.height;
        module.callMain(["--disable-video"]);
      },
      fsUpdate: async (filePtr, bufferPtr, length) => {
        const toast = document.getElementById("save-toast");
        toast?.classList.remove("hidden", "opacity-0");
        try {
          if (length <= 0) {
            console.warn("Trying to save empty file", file);
            return;
          }
          const file = module.UTF8ToString(filePtr);
          const contents = module.HEAPU8.slice(bufferPtr, bufferPtr + length);
          if (file.endsWith(".vsgm1") && file.indexOf("/Autosave/") === -1) {
            if (typeof v8key === "string" && v8key.length === 5) {
              try {
                const tokenResponse = await fetch(`https://cloud.dos.zone/token/get?id=${encodeURIComponent(v8key)}`);
                if (tokenResponse.ok) {
                  const { premium, email, token } = await tokenResponse.json();
                  if (premium === true && email && email.length > 0 && token && token.length > 0) {
                    module.cloudSaves.set(file, contents);

                    const encoder = new TextEncoder();
                    const entries = Array.from(module.cloudSaves.entries());
                    let payloadSize = 4;
                    for (const [key, value] of entries) {
                      payloadSize += 8 + encoder.encode(key).length + value.length;
                    }

                    const payload = new Uint8Array(payloadSize);
                    writeUint32(payload, entries.length, 0);

                    let offset = 4;
                    for (const [key, value] of entries) {
                      const encodedKey = encoder.encode(key);
                      const keyLength = encodedKey.length;
                      const valueLength = value.length;

                      offset = writeUint32(payload, keyLength, offset);
                      offset = writeUint32(payload, valueLength, offset);

                      payload.set(encodedKey, offset);
                      offset += keyLength;
                      payload.set(value, offset);
                      offset += valueLength;
                    }

                    const boundSize = compressBound(payload.length);
                    const compressed = new Uint8Array(boundSize + 4);
                    writeUint32(compressed, payload.length, 0);

                    const compressedSize = compress(payload, compressed, 4, compressed.length);
                    const upload = compressed.slice(0, compressedSize);

                    const presign = await (await fetch(presignPut + "?path=" +
                      encodeURIComponent("vcmi.saves") + "&token=" + token)).json();

                    if (presign.success) {
                      const formData = new FormData();
                      Object.entries(presign.post.fields).forEach(([key, value]) => {
                        formData.append(key, value);
                      });
                      formData.append("acl", "public-read");
                      formData.append("file", new Blob([upload]));

                      const response = await fetch(presign.post.url, {
                        method: "post",
                        body: formData,
                      });

                      if (response.status !== 200 && response.status !== 204) {
                        console.error("Unable to put changes: " + response.statusText);
                      }
                    } else {
                      console.error("Failed to generate presign put request", presign);
                    }
                  }
                }
              } catch (error) {
                console.error(error);
              }
            }
          }
        } finally {
          module._free(filePtr);
          module._free(bufferPtr);
          toast?.classList.add("opacity-0");
          window.setTimeout(() => {
            toast?.classList.add("hidden");
          }, 180);
        }
      },
      cloudSaves: new Map(),
    };

    const cloudSaves = (async () => {
      if (typeof v8key === "string" && v8key.length === 5) {
        try {
          const tokenResponse = await fetch(`https://cloud.dos.zone/token/get?id=${encodeURIComponent(v8key)}`);
          if (tokenResponse.ok) {
            const { premium, email } = await tokenResponse.json();
            if (premium === true && email && email.length > 0) {
              const response = (await fetch(
                "https://storage.yandexcloud.net/doszone-uploads/personal-v2/cloud/" +
                email + "/vcmi.saves", {
                cache: "no-cache",
              }));
              if (response.status === 200) {
                await opfsList("/home/web_user/.local/share/vcmi");

                const decoder = new TextDecoder();
                const compressed = new Uint8Array(await response.arrayBuffer());
                const uncompressedSize = readUint32(compressed, 0);
                const uncompressed = new Uint8Array(uncompressedSize);

                if (uncompress(compressed, uncompressed, 4) === uncompressedSize) {
                  const count = readUint32(uncompressed, 0);
                  let offset = 4;
                  for (let i = 0; i < count; i++) {
                    const keyLength = readUint32(uncompressed, offset);
                    offset += 4;
                    const valueLength = readUint32(uncompressed, offset);
                    offset += 4;
                    const key = decoder.decode(uncompressed.slice(offset, offset + keyLength));
                    offset += keyLength;
                    const value = uncompressed.slice(offset, offset + valueLength);
                    offset += valueLength;

                    if (key.indexOf("/Autosave/") === -1) {
                      module.cloudSaves.set(key, value.slice(0));
                      console.log("adding savegame", key, Math.round(value.length / 1024), "kb");
                    } else {
                      console.log("ignoring autosave", key, Math.round(value.length / 1024), "kb");
                    }

                    await opfsWrite(
                      "/home/web_user/.local/share/vcmi",
                      key.substring("/home/web_user/.local/share/vcmi/".length),
                      0, value, value.length);
                  }
                }

                await opfsFlush("/home/web_user/.local/share/vcmi");
              }
            }
          }
        } catch (error) {
          console.error(error);
        }
      }
    })();

    window.Module = module;
  </script>
  <script type="module">
    import { opfsList, opfsWrite, opfsFlush } from './opfs-worker.js';

    window.opfsList = opfsList;
    window.opfsWrite = opfsWrite;
    window.opfsFlush = opfsFlush;
  </script>
  <script type="text/javascript" src="dialogs.js"></script>
  <script type="text/javascript" src="mini-lz4.js"></script>
  <script type="text/javascript" src="vcmiclient.data.js"></script>
  <script type="module">
    import DOSVCMI from './vcmiclient.js';
    DOSVCMI(window.Module);
  </script>
</body>

</html>
